name: masterhand

services:
  masterhand:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      OPENCODE_URL: http://opencode:4096
      DATA_DIR: /data
      WEB_DIST: apps/web/dist
      # Every workspace is a subfolder created here (same path opencode sees).
      WORKSPACES_ROOT: /workspace
      # Per-session git worktrees; inside the shared mount so opencode sees them.
      WORKTREES_ROOT: /workspace/.worktrees
    volumes:
      - masterhand_data:/data
      # Shared with opencode: the BFF creates each workspace subfolder here.
      - ${WORKSPACES_DIR:-../workspace}:/workspace
    ports:
      # Bind to 127.0.0.1 when your reverse proxy runs on the host.
      - "${MASTERHAND_BIND:-0.0.0.0}:${MASTERHAND_PORT:-8787}:8787"
    networks:
      - internal
    depends_on:
      - opencode

  opencode:
    build:
      context: .
      dockerfile: opencode.Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Only the opencode credentials are shared with this container; the BFF
      # secrets (MASTERHAND_PASSWORD, SESSION_SECRET) stay out of it.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set it in deploy/.env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
    volumes:
      - opencode_config:/home/node/.config/opencode
      - opencode_data:/home/node/.local/share/opencode
      - ${WORKSPACES_DIR:-../workspace}:/workspace
    working_dir: /workspace
    expose:
      - "4096"
    networks:
      - internal

networks:
  internal:

volumes:
  masterhand_data:
  opencode_config:
  opencode_data:
